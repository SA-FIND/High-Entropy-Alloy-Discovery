<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Computational Materials Intelligence: Predict High Entropy Alloy properties such as density and shear strength using ML and Matminer features.">
    <meta name="keywords" content="materials science, HEA, high entropy alloy, machine learning, prediction, density, shear strength, MetaForge">
    <title>MetaForge — HEA Predictor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #06080f;
            --bg-surface: #0d1117;
            --bg-card: #111827;
            --border-subtle: #1f2937;
            
            --text-primary: #e8ecf4;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;

            --el-al: #3b82f6;
            --el-ti: #8b5cf6;
            --el-sc: #10b981;
            --el-zr: #f59e0b;
            --el-v: #ef4444;

            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header__title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .header__subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 32px;
        }

        .card__title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 12px;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .el-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .el-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group input[type="number"] {
            width: 60px;
            padding: 4px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: var(--font-mono);
            border-radius: 4px;
            text-align: center;
        }

        .input-group input[type="number"]:focus-visible {
            outline: 2px solid var(--el-al);
            outline-offset: 1px;
        }

        .normalized-val {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-secondary);
            min-width: 45px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border-subtle);
            border-radius: 2px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        input[type="range"]:focus-visible::-webkit-slider-thumb {
            outline: 2px solid var(--el-al);
            outline-offset: 2px;
        }

        .donut-section {
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .donut-svg {
            width: 100px;
            height: 100px;
            transform: rotate(-90deg);
        }

        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .results-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .result-tile {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 24px;
            border-radius: 8px;
            text-align: center;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .result-value {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .result-unit {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-left: 4px;
        }

        /* Value colors */
        .val-density { color: #ef4444; }
        .val-strength { color: #10b981; }
        .val-score { color: #3b82f6; }

        .loading-bar {
            position: fixed;
            top: 0; left: 0; right: 0; height: 3px;
            background: #3b82f6;
            opacity: 0;
            transition: opacity 0.2s;
        }


        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            background-color: var(--bg-deep);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background-color: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div class="loading-bar" id="loadingBar"></div>

    <main class="app-container">
        <header class="header">
            <h1 class="header__title">Computational Materials Intelligence</h1>
            <p class="header__subtitle">
                Configure alloy composition to generate real-time structural property predictions using ML models and material features.
            </p>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2 class="card__title">Alloy Composition</h2>
                <div id="categoryTabs" class="category-tabs"></div>
                <div id="sliders-container"></div>
                
                <div class="donut-section">
                    <svg class="donut-svg" viewBox="0 0 32 32" id="donutChart" aria-hidden="true"></svg>
                    <div class="donut-legend" id="donutLegend"></div>
                </div>
            </div>

            <div class="card">
                <h2 class="card__title">ML Predictions</h2>
                <div class="results-stack">
                    <div class="result-tile">
                        <div class="result-label">Predicted Density</div>
                        <div class="result-value val-density"><span id="val-density">0.00</span><span class="result-unit">g/cm³</span></div>
                    </div>
                    <div class="result-tile">
                        <div class="result-label">Predicted Shear Strength</div>
                        <div class="result-value val-strength"><span id="val-strength">0.00</span><span class="result-unit">GPa</span></div>
                    </div>
                    <div class="result-tile" style="border-color: #3b82f6;">
                        <div class="result-label" style="color: #3b82f6;">Specific Strength Score</div>
                        <div class="result-value val-score"><span id="val-score">0.00</span><span class="result-unit">GPa·cm³/g</span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Define the Metallurgical Universes
        const ALLOY_FAMILIES = {
            "Aerospace (Lightweight)": [
                { sym: 'Al', name: 'Aluminium', color: '#3b82f6' },
                { sym: 'Ti', name: 'Titanium', color: '#8b5cf6' },
                { sym: 'Sc', name: 'Scandium', color: '#10b981' },
                { sym: 'Zr', name: 'Zirconium', color: '#f59e0b' },
                { sym: 'V',  name: 'Vanadium', color: '#ef4444' }
            ],
            "Corrosion Resistant": [
                { sym: 'Co', name: 'Cobalt', color: '#3b82f6' },
                { sym: 'Cr', name: 'Chromium', color: '#8b5cf6' },
                { sym: 'Fe', name: 'Iron', color: '#10b981' },
                { sym: 'Ni', name: 'Nickel', color: '#f59e0b' },
                { sym: 'Cu', name: 'Copper', color: '#ef4444' }
            ],
            "Refractory (High Temp)": [
                { sym: 'Mo', name: 'Molybdenum', color: '#3b82f6' },
                { sym: 'Nb', name: 'Niobium', color: '#8b5cf6' },
                { sym: 'Ta', name: 'Tantalum', color: '#10b981' },
                { sym: 'V',  name: 'Vanadium', color: '#f59e0b' },
                { sym: 'W',  name: 'Tungsten', color: '#ef4444' }
            ]
        };

        let currentCategory = "Aerospace (Lightweight)";
        let elements = ALLOY_FAMILIES[currentCategory];
        let state = {};
        let resultsComp = {};
        let debounceTimer = null;

        const container = document.getElementById('sliders-container');
        const donutChart = document.getElementById('donutChart');
        const donutLegend = document.getElementById('donutLegend');
        const loadingBar = document.getElementById('loadingBar');
        const tabsContainer = document.getElementById('categoryTabs');

        // Initialize state to 20% for each element
        function initState() {
            state = {};
            elements.forEach(el => state[el.sym] = 20);
        }

        function renderTabs() {
            tabsContainer.innerHTML = Object.keys(ALLOY_FAMILIES).map(cat => 
                <button class="tab-btn ${cat === currentCategory ? 'active' : ''}" 
                        onclick="switchCategory('${cat}')">
                    ${cat}
                </button>
            ).join('');
        }

        function switchCategory(cat) {
            currentCategory = cat;
            elements = ALLOY_FAMILIES[cat];
            initState();
            renderTabs();
            initUI();
        }

        function initUI() {
            container.innerHTML = elements.map(el => 
                <div class="slider-group">
                    <div class="slider-header">
                        <div class="el-label">
                            <div class="el-dot" style="background-color: ${el.color}"></div>
                            ${el.sym} <span style="color: var(--text-muted); font-size: 0.85rem; font-weight: 400; margin-left: 4px;">${el.name}</span>
                        </div>
                        <div class="input-group">
                            <input type="number" id="num-${el.sym}" aria-label=$"{el.name} percentage input" value=$"{state[el.sym]}" min="0" max="100">
                            <div class="normalized-val" id="norm-${el.sym}">0.0%</div>
                        </div>
                    </div>
                    <input type="range" id="range-${el.sym}" aria-label=$"{el.name} slider" value=$"{state[el.sym]}" min="0" max="100">
                </div>
            ).join('');

            elements.forEach(el => {
                const numInput = document.getElementById(
um-${el.sym});
                const rangeInput = document.getElementById(
ange-${el.sym});

                const update = (val) => {
                    let parsed = parseInt(val, 10);
                    if (isNaN(parsed)) parsed = 0;
                    if (parsed < 0) parsed = 0;
                    if (parsed > 100) parsed = 100;
                    
                    state[el.sym] = parsed;
                    numInput.value = parsed;
                    rangeInput.value = parsed;
                    schedulePredict();
                };

                numInput.addEventListener('input', e => update(e.target.value));
                rangeInput.addEventListener('input', e => update(e.target.value));
            });

            predict(); // Initial call
        }

        function schedulePredict() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(predict, 300);
        }

        function updateDonut() {
            let svgContent = '';
            let legendContent = '';
            let cumulative = 0;
            
            elements.forEach(el => {
                const pct = resultsComp[el.sym] || 0;
                if (pct > 0) {
                    const dasharray = ${pct} 100;
                    const dashoffset = -cumulative;
                    svgContent += <circle r="15.91549430918954" cx="16" cy="16" fill="transparent" stroke=$"{el.color}" stroke-width="6" stroke-dasharray=$"{dasharray}" stroke-dashoffset=$"{dashoffset}"></circle>;
                    cumulative += pct;

                    legendContent += 
                        <div class="legend-item">
                            <div class="el-dot" style="background-color: ${el.color}"></div>
                            ${el.sym} ${pct.toFixed(1)}%
                        </div>
                    ;
                }
            });

            donutChart.innerHTML = svgContent || <circle r="15.91549430918954" cx="16" cy="16" fill="transparent" stroke="var(--border-subtle)" stroke-width="6"></circle>;
            donutLegend.innerHTML = legendContent;
        }

        async function predict() {
            loadingBar.style.opacity = '1';
            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
                const data = await res.json();
                
                document.getElementById('val-density').innerText = data.density;
                document.getElementById('val-strength').innerText = data.strength;
                document.getElementById('val-score').innerText = data.score;
                
                resultsComp = data.composition;
                
                // Update normalized labels
                elements.forEach(el => {
                    const normEl = document.getElementById(
orm-${el.sym});
                    if (normEl) {
                        normEl.innerText = (resultsComp[el.sym] || 0).toFixed(1) + '%';
                    }
                });

                updateDonut();
            } catch (err) {
                console.error(err);
            } finally {
                loadingBar.style.opacity = '0';
            }
        }

        // Boot sequence
        initState();
        renderTabs();
        initUI();
    </script>
</body>
</html>
