<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="nucleusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Dark glass rounded badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Crystal Supercell Lattice Bonds -->
  <g stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 13 L51 24 L51 44 L32 55 L13 44 L13 24 Z" />
    <path d="M32 34 L32 13" />
    <path d="M32 34 L51 24" />
    <path d="M32 34 L51 44" />
    <path d="M32 34 L32 55" />
    <path d="M32 34 L13 44" />
    <path d="M32 34 L13 24" />
  </g>

  <!-- Multi-Principal Element Atomic Nodes -->
  <circle cx="32" cy="13" r="4.5" fill="#3b82f6"/>
  <circle cx="51" cy="24" r="4" fill="#8b5cf6"/>
  <circle cx="51" cy="44" r="4" fill="#f59e0b"/>
  <circle cx="32" cy="55" r="4.5" fill="#10b981"/>
  <circle cx="13" cy="44" r="4" fill="#ef4444"/>
  <circle cx="13" cy="24" r="4" fill="#06b6d4"/>

  <!-- Central Core High-Entropy Nucleus -->
  <circle cx="32" cy="34" r="6" fill="url(#nucleusGrad)" stroke="#ffffff" stroke-width="1.5"/>
</svg>
