<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background rounded square gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>

    <!-- Top facet: illuminated sky/electric blue -->
    <linearGradient id="topFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Left facet: royal cobalt blue -->
    <linearGradient id="leftFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right facet: deep titanium navy -->
    <linearGradient id="rightFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing core filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Dark glass container with subtle border for dark & light browser tabs -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- 3D Isometric Crystal Cube Facets -->
  <!-- Top Facet -->
  <polygon points="32,9 52,20.5 32,32 12,20.5" fill="url(#topFacetGrad)"/>

  <!-- Left Facet -->
  <polygon points="12,20.5 32,32 32,55 12,43.5" fill="url(#leftFacetGrad)"/>

  <!-- Right Facet -->
  <polygon points="32,32 52,20.5 52,43.5 32,55" fill="url(#rightFacetGrad)"/>

  <!-- Crisp Internal Edges -->
  <line x1="32" y1="32" x2="32" y2="9" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5"/>
  <line x1="32" y1="32" x2="12" y2="43.5" stroke="rgba(15, 23, 42, 0.4)" stroke-width="1.5"/>
  <line x1="32" y1="32" x2="52" y2="43.5" stroke="rgba(15, 23, 42, 0.6)" stroke-width="1.5"/>

  <!-- Outer Bevel Perimeter -->
  <polygon points="32,9 52,20.5 52,43.5 32,55 12,43.5 12,20.5" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Center Lattice Core (BCC Atom Node) -->
  <circle cx="32" cy="32" r="3.8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#coreGlow)"/>
</svg>
