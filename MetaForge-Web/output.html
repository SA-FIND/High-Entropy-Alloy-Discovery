<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="MetaForge — ML-powered High Entropy Alloy predictor for aerospace material discovery. Configure compositions and get real-time density, strength, and specific strength predictions.">

    <!-- Open Graph / Social SEO -->
    <meta property="og:title" content="MetaForge — HEA Predictor">
    <meta property="og:description"
        content="MetaForge — ML-powered High Entropy Alloy predictor for aerospace material discovery. Configure compositions and get real-time density, strength, and specific strength predictions.">
    <meta property="og:type" content="website">
    <meta property="og:image"
        content="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200&auto=format&fit=crop">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MetaForge — HEA Predictor">
    <meta name="twitter:description"
        content="ML-powered High Entropy Alloy predictor for aerospace material discovery.">

    <title>MetaForge — HEA Predictor</title>

    <!-- Preload critical resources for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
        as="style">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="preload" href="https://unpkg.com/react@18/umd/react.development.js" as="script">
    <link rel="preload" href="https://unpkg.com/react-dom@18/umd/react-dom.development.js" as="script">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* ═══════════════════════════════════════════
           DESIGN SYSTEM TOKENS
           ═══════════════════════════════════════════ */
        :root {
            --bg-deep: #06080f;
            --bg-surface: #0d1117;
            --bg-card: rgba(17, 24, 39, 0.65);
            --bg-card-hover: rgba(22, 30, 48, 0.75);
            --bg-inset: rgba(6, 8, 15, 0.6);

            --border-subtle: rgba(99, 120, 170, 0.12);
            --border-glow: rgba(99, 140, 255, 0.25);

            --text-primary: #e8ecf4;
            --text-secondary: #8b95a8;
            --text-muted: #525d72;

            /* Element accent colors — inspired by periodic table group conventions */
            --el-al: #60a5fa;
            /* Aluminium — blue (post-transition metal) */
            --el-ti: #a78bfa;
            /* Titanium — violet (transition metal) */
            --el-sc: #34d399;
            /* Scandium — emerald (rare earth-adjacent) */
            --el-zr: #fbbf24;
            /* Zirconium — amber (transition metal) */
            --el-v: #f87171;
            /* Vanadium — rose (transition metal) */

            --accent-primary: #638cff;
            --accent-glow: rgba(99, 140, 255, 0.35);
            --accent-success: #34d399;
            --accent-warning: #fbbf24;
            --accent-danger: #f87171;

            --glass-blur: 20px;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;

            --shadow-card: 0 4px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--border-subtle);
            --shadow-glow: 0 0 40px var(--accent-glow), 0 4px 32px rgba(0, 0, 0, 0.4);

            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

            --transition-fast: 180ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 350ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ═══════════════════════════════════════════
           RESET & BASE
           ═══════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background gradient mesh */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: transparent;
            pointer-events: none;
            z-index: 0;
            animation: meshDrift 20s ease-in-out infinite alternate;
        }

        @keyframes meshDrift {
            0% {
                transform: scale(1) translate(0, 0);
            }

            100% {
                transform: scale(1.05) translate(-1%, 2%);
            }
        }

        /* ═══════════════════════════════════════════
           LAYOUT
           ═══════════════════════════════════════════ */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1120px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        /* ═══════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════ */
        .header {
            text-align: center;
            margin-bottom: 56px;
        }

        .header__badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 100px;
            background: rgba(99, 140, 255, 0.08);
            border: 1px solid rgba(99, 140, 255, 0.15);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 20px;
        }

        .header__badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-success);
            box-shadow: 0 0 8px var(--accent-success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .header__title {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .header__subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ═══════════════════════════════════════════
           GRID
           ═══════════════════════════════════════════ */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ═══════════════════════════════════════════
           GLASS CARD
           ═══════════════════════════════════════════ */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-card);
            transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
        }

        .glass-card:hover {
            border-color: var(--border-glow);
        }

        .card__header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .card__icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .card__icon--compose {
            background: rgba(99, 140, 255, 0.1);
            border: 1px solid rgba(99, 140, 255, 0.15);
        }

        .card__icon--predict {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.15);
        }

        .card__title {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        /* ═══════════════════════════════════════════
           SLIDER GROUP
           ═══════════════════════════════════════════ */
        .slider-group {
            margin-bottom: 22px;
        }

        .slider-group:last-child {
            margin-bottom: 0;
        }

        .slider__label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .slider__element-name {
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider__element-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .slider__normalized {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--bg-inset);
        }

        /* Custom range slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 100px;
            background: rgba(82, 93, 114, 0.25);
            outline: none;
            cursor: pointer;
            transition: background var(--transition-fast);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: grab;
            transition: transform var(--transition-spring), box-shadow var(--transition-fast);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]:active::-webkit-slider-thumb {
            cursor: grabbing;
            transform: scale(1.1);
        }

        /* Element-specific slider theming */
        .slider--al input[type="range"]::-webkit-slider-thumb {
            background: var(--el-al);
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
        }

        .slider--ti input[type="range"]::-webkit-slider-thumb {
            background: var(--el-ti);
            box-shadow: 0 0 12px rgba(167, 139, 250, 0.4);
        }

        .slider--sc input[type="range"]::-webkit-slider-thumb {
            background: var(--el-sc);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }

        .slider--zr input[type="range"]::-webkit-slider-thumb {
            background: var(--el-zr);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
        }

        .slider--v input[type="range"]::-webkit-slider-thumb {
            background: var(--el-v);
            box-shadow: 0 0 12px rgba(248, 113, 113, 0.4);
        }

        /* Filled track via linear-gradient (set via inline style in JS) */
        .slider--al input[type="range"] {
            --track-color: var(--el-al);
        }

        .slider--ti input[type="range"] {
            --track-color: var(--el-ti);
        }

        .slider--sc input[type="range"] {
            --track-color: var(--el-sc);
        }

        .slider--zr input[type="range"] {
            --track-color: var(--el-zr);
        }

        .slider--v input[type="range"] {
            --track-color: var(--el-v);
        }

        /* ═══════════════════════════════════════════
           DONUT CHART
           ═══════════════════════════════════════════ */
        .donut-section {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .donut {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            transition: transform var(--transition-spring);
        }

        .donut:hover {
            transform: scale(1.06);
        }

        .donut__hole {
            position: absolute;
            inset: 18px;
            border-radius: 50%;
            background: var(--bg-surface);
            display: grid;
            place-items: center;
        }

        .donut__total {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .donut__legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        /* ═══════════════════════════════════════════
           RESULT CARDS
           ═══════════════════════════════════════════ */
        .results-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .result-tile {
            background: var(--bg-inset);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 22px 24px;
            text-align: center;
            transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth), transform var(--transition-spring);
            position: relative;
            overflow: hidden;
        }

        .result-tile:hover {
            transform: translateY(-2px);
            border-color: var(--border-glow);
        }

        .result-tile--hero {
            background: rgba(99, 140, 255, 0.06);
            border-color: rgba(99, 140, 255, 0.2);
        }

        .result-tile--hero:hover {
            box-shadow: var(--shadow-glow);
        }

        .result-tile__label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-tile--hero .result-tile__label {
            color: var(--accent-primary);
        }

        .result-tile__value {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            transition: color var(--transition-fast);
        }

        .result-tile__unit {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 4px;
        }

        .result-tile__value--density {
            color: var(--accent-danger);
        }

        .result-tile__value--strength {
            color: var(--accent-success);
        }

        .result-tile__value--score {
            color: var(--accent-primary);
        }

        /* Update shimmer animation */
        .result-tile--updating {
            animation: shimmer 0.6s ease-out;
        }

        @keyframes shimmer {
            0% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        /* ═══════════════════════════════════════════
           LOADING INDICATOR
           ═══════════════════════════════════════════ */
        .loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: var(--accent-primary);
            background-size: 200% 100%;
            z-index: 999;
            transition: width var(--transition-smooth), opacity var(--transition-fast);
            animation: loadingGradient 1.5s linear infinite;
        }

        @keyframes loadingGradient {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        /* ═══════════════════════════════════════════
           FOOTER
           ═══════════════════════════════════════════ */
        .footer {
            text-align: center;
            margin-top: 56px;
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Loading bar -->
    <div id="loading-bar" class="loading-bar" style="width: 0; opacity: 0;"></div>

    <div id="root"></div>

    <script type="text/babel">
        
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── Element Configuration ───────────────────────
        const ELEMENTS = [
            { sym: 'Al', name: 'Aluminium', num: 13, css: 'al' },
            { sym: 'Ti', name: 'Titanium', num: 22, css: 'ti' },
            { sym: 'Sc', name: 'Scandium', num: 21, css: 'sc' },
            { sym: 'Zr', name: 'Zirconium', num: 40, css: 'zr' },
            { sym: 'V', name: 'Vanadium', num: 23, css: 'v' },
        ];

        const ELEMENT_COLORS = {
            Al: 'var(--el-al)',
            Ti: 'var(--el-ti)',
            Sc: 'var(--el-sc)',
            Zr: 'var(--el-zr)',
            V: 'var(--el-v)',
        };

        // ─── Debounce Hook ───────────────────────────────
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const id = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(id);
            }, [value, delay]);
            return debouncedValue;
        }

        // ─── Composition Donut ───────────────────────────
        function CompositionDonut({ composition }) {
            const entries = ELEMENTS.map(el => ({
                sym: el.sym,
                pct: composition[el.sym] || 0,
                color: ELEMENT_COLORS[el.sym],
            })).filter(e => e.pct > 0);

            let cumulative = 0;
            const segments = entries.map(e => {
                const start = cumulative;
                cumulative += e.pct;
                return `${e.color} ${start}% ${cumulative}%`;
            });

            const gradient = segments.length > 0
                ? `conic-gradient(${segments.join(', ')})`
                : 'conic-gradient(var(--text-muted) 0% 100%)';

            return (
                <div className="donut-section">
                    <div className="donut" style={{ background: gradient }}>
                        <div className="donut__hole">
                            <span className="donut__total">100%</span>
                        </div>
                    </div>
                    <div className="donut__legend">
                        {entries.map(e => (
                            <div key={e.sym} className="legend-item">
                                <span className="legend-dot" style={{ background: e.color }}></span>
                                {e.sym} {e.pct.toFixed(1)}%
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ─── Result Tile ─────────────────────────────────
        function ResultTile({ label, value, unit, colorClass, hero, updating }) {
            return (
                <div className={`result-tile ${hero ? 'result-tile--hero' : ''} ${updating ? 'result-tile--updating' : ''}`}>
                    <div className="result-tile__label">{label}</div>
                    <div className={`result-tile__value ${colorClass}`}>
                        {value}
                        {unit && <span className="result-tile__unit">{unit}</span>}
                    </div>
                </div>
            );
        }

        // ─── Main App ────────────────────────────────────
        function App() {
            const [sliders, setSliders] = useState({ Al: 20, Ti: 20, Sc: 20, Zr: 20, V: 20 });
            const [results, setResults] = useState({ density: 0, strength: 0, score: 0, composition: {} });
            const [loading, setLoading] = useState(false);
            const [updating, setUpdating] = useState(false);
            const debouncedSliders = useDebounce(sliders, 300);
            const loadingBar = useRef(null);

            // Fetch prediction on debounced slider change
            useEffect(() => {
                setLoading(true);
                setUpdating(true);

                const bar = document.getElementById('loading-bar');
                if (bar) {
                    bar.style.opacity = '1';
                    bar.style.width = '70%';
                }

                fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(debouncedSliders),
                })
                    .then(res => res.json())
                    .then(data => {
                        setResults(data);
                        setLoading(false);
                        if (bar) {
                            bar.style.width = '100%';
                            setTimeout(() => {
                                bar.style.opacity = '0';
                                bar.style.width = '0';
                            }, 300);
                        }
                        setTimeout(() => setUpdating(false), 600);
                    })
                    .catch(err => {
                        console.error('Prediction error:', err);
                        setLoading(false);
                        if (bar) {
                            bar.style.opacity = '0';
                            bar.style.width = '0';
                        }
                    });
            }, [debouncedSliders]);

            const handleSlider = useCallback((sym, value) => {
                setSliders(prev => ({ ...prev, [sym]: parseInt(value, 10) }));
            }, []);

            // Build track fill style per slider
            const trackStyle = (value) => ({
                background: 'rgba(82, 93, 114, 0.25)',
            });

            return (
                <div className="app-container">
                    {/* Header */}
                    <header className="header">
                        <div className="header__badge">Server Active — Matminer + RandomForest</div>
                        <h1 className="header__title">MetaForge Materials Predictor</h1>
                        <p className="header__subtitle">
                            Configure alloy composition to generate real-time property predictions using RandomForest regression and material features.
                        </p>
                    </header>

                    {/* Main Grid */}
                    <div className="main-grid">
                        {/* Left: Composition Sliders */}
                        <div className="glass-card">
                            <div className="card__header">
                                <h2 className="card__title">Alloy Composition</h2>
                            </div>

                            {ELEMENTS.map(el => (
                                <div key={el.sym} className={`slider-group slider--${el.css}`}>
                                    <div className="slider__label">
                                        <span className="slider__element-name">
                                            <span className="slider__element-dot" style={{ background: ELEMENT_COLORS[el.sym] }}></span>
                                            {el.sym}
                                            <span style={{ color: 'var(--text-muted)', fontWeight: 400, fontSize: '0.78rem' }}>{el.name}</span>
                                        </span>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                            <input
                                                type="number"
                                                min="0"
                                                max="100"
                                                value={sliders[el.sym]}
                                                onChange={e => handleSlider(el.sym, e.target.value)}
                                                style={{ width: '60px', padding: '4px', borderRadius: '4px', border: '1px solid var(--border-subtle)', background: 'var(--bg-inset)', color: 'var(--text-primary)', fontFamily: 'var(--font-mono)', fontSize: '0.78rem' }}
                                            />
                                            <span className="slider__normalized">
                                                {(results.composition && results.composition[el.sym] != null) ? results.composition[el.sym].toFixed(1) : '0.0'}%
                                            </span>
                                        </div>
                                    </div>
                                    <input
                                        id={`slider-${el.sym}`}
                                        type="range"
                                        min="0"
                                        max="100"
                                        aria-label={`Adjust ${el.name} composition percentage`}
                                        value={sliders[el.sym]}
                                        onChange={e => handleSlider(el.sym, e.target.value)}
                                        style={trackStyle(sliders[el.sym])}
                                    />
                                </div>
                            ))}

                            <CompositionDonut composition={results.composition || {}} />
                        </div>

                        {/* Right: Predictions */}
                        <div className="glass-card">
                            <div className="card__header">
                                <h2 className="card__title">ML Predictions</h2>
                            </div>

                            <div className="results-stack">
                                <ResultTile
                                    label="Predicted Density"
                                    value={results.density}
                                    unit="g/cm³"
                                    colorClass="result-tile__value--density"
                                    updating={updating}
                                />
                                <ResultTile
                                    label="Predicted Shear Strength"
                                    value={results.strength}
                                    unit="GPa"
                                    colorClass="result-tile__value--strength"
                                    updating={updating}
                                />
                                <ResultTile
                                    label="Specific Strength Score"
                                    value={results.score}
                                    unit="GPa·cm³/g"
                                    colorClass="result-tile__value--score"
                                    hero={true}
                                    updating={updating}
                                />
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="footer">
                        MetaForge | Computational Materials Intelligence
                    </footer>
                </div>
            );
        }

        // ─── Mount ───────────────────────────────────────
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
    </script>
</body>

</html>
